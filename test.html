<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Assistant & Knowledge Base</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      transition: background-color 0.3s;
    }

    .status-dot.active {
      background-color: var(--success);
      box-shadow: 0 0 10px var(--success);
    }

    .section-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .answer-container {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      min-height: 120px;
      max-height: 350px;
      overflow-y: auto;
      margin-bottom: 20px;
      font-size: 17px;
      line-height: 1.6;
      color: var(--text-main);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
      white-space: pre-line;
    }

    .interaction-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .last-question {
      font-size: 14px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      min-height: 20px;
    }

    .start-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .start-btn:hover {
      opacity: 0.95;
      box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
    }

    .start-btn:active {
      transform: scale(0.98);
    }

    #debug-log {
      margin-top: 15px;
      font-size: 12px;
      color: #fca5a5;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 10px;
      border-radius: 8px;
      word-break: break-word;
      font-family: monospace;
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="logo-area">
        <div class="app-icon">AI</div>
        <div class="app-title">Voice Assistant</div>
      </div>
      <div class="status-badge">
        <div id="dot" class="status-dot"></div>
        <span id="status-text">Neaktivní</span>
      </div>
    </div>
    
    <div class="section-label">Odpověď od AI</div>
    <div id="answer" class="answer-container">Klikněte na tlačítko spustit pro zahájení hlasového odposlechu...</div>

    <div class="interaction-panel">
      <div class="section-label">Poslední aktivita</div>
      <div id="question" class="last-question">Zatím neproběhla žádná komunikace.</div>
      
      <button id="startBtn" class="start-btn" onclick="startListening()">Spustit asistenta</button>
    </div>

    <div id="debug-log"></div>
  </div>

  <script>
    let GROQ_API_KEY = localStorage.getItem("groq_api_key");

    if (!GROQ_API_KEY || GROQ_API_KEY.trim() === "") {
      GROQ_API_KEY = prompt("Zadej svůj Groq API klíč (uloží se bezpečně do tvého prohlížeče):");
      if (GROQ_API_KEY) {
        localStorage.setItem("groq_api_key", GROQ_API_KEY.trim());
      }
    }

    let recognition;
    let isListening = false;
    let lastSentQuery = "";

    function logError(msg) {
      console.error(msg);
      const debugEl = document.getElementById('debug-log');
      debugEl.innerText = "CHYBA: " + msg;
      debugEl.style.display = 'block';
    }

    async function keepScreenAwake() {
      if ('wakeLock' in navigator) {
        try {
          await navigator.wakeLock.request('screen');
        } catch (err) {}
      }
    }

    function isQuestion(text) {
      const lower = text.toLowerCase();
      const questionWords = [
        "kdo", "co", "jak", "kolik", "kde", "kdy", "proč", 
        "který", "jaký", "čí", "kudy", "odkud", "kam", 
        "může", "má", "je", "byl", "bude", "kolikrát"
      ];

      const startsWithQWord = questionWords.some(word => lower.startsWith(word));
      const containsQuestionMark = text.includes("?");

      return startsWithQWord || containsQuestionMark || text.length > 5;
    }

    function startListening() {
      if (!GROQ_API_KEY) {
        alert("Chybí API klíč! Obnov stránku a zadej ho.");
        return;
      }

      keepScreenAwake();
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('answer').innerText = "Naslouchám vašemu hlasu...";
      document.getElementById('status-text').innerText = "Aktivní";
      document.getElementById('debug-log').style.display = 'none';
      
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Prohlížeč nepodporuje rozpoznávání řeči.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'cs-CZ';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('dot').classList.add('active');
      };

      recognition.onresult = async (event) => {
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          }
        }

        const currentText = finalTranscript.trim();

        if (currentText.length > 3 && currentText !== lastSentQuery) {
          if (isQuestion(currentText)) {
            lastSentQuery = currentText;
            document.getElementById('question').innerText = "❓ " + currentText;
            getFastAnswer(currentText);
          } else {
            document.getElementById('question').innerText = "💬 (Ignorováno - běžná řeč): " + currentText;
          }
        }
      };

      recognition.onerror = (e) => {
        logError("Chyba mikrofonu: " + e.error);
      };

      recognition.onend = () => {
        if (isListening) {
          recognition.start();
        }
      };

      recognition.start();
    }

    async function getFastAnswer(question) {
      document.getElementById('answer').innerText = "Vyhledávám odpověď...";

      const now = new Date();
      const currentYear = now.getFullYear();

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: "qwen/qwen3.6-27b",
            reasoning_effort: "none", // Vynutíme vypnutí přemýšlecího procesu
            messages: [
              { 
                role: "system", 
                content: `Jsi inteligentní a moderní AI asistent. Dnešní rok je ${currentYear}. Když se uživatel ptá na věk osoby, spočítej ho přesně k tomuto roku (${currentYear}). Odpovídej věcně, srozumitelně a přehledně.` 
              },
              { role: "user", content: question }
            ],
            max_tokens: 200,
            temperature: 0.1
          })
        });

        const data = await response.json();

        if (!response.ok) {
          logError(JSON.stringify(data, null, 2));
          document.getElementById('answer').innerText = "Chyba API rozhraní (zkontroluj platnost klíče).";
          return;
        }

        let reply = "";
        try {
          const msg = data.choices?.[0]?.message;
          reply = (msg?.content || "") + (msg?.reasoning || "");
        } catch (e) {
          reply = "";
        }

        // Kdyby se přeci jen objevilo thinking, odřízneme ho
        if (reply.includes("</think>")) {
          const parts = reply.split("</think>");
          reply = parts[parts.length - 1];
        }
        if (reply.includes("<think>")) {
          reply = reply.replace(/<think>[\s\S]*?<\/think>/g, '');
        }

        if (reply.trim()) {
          let cleanReply = reply.trim().replace(/\*\*/g, '');
          document.getElementById('answer').innerText = cleanReply;
        } else {
          document.getElementById('answer').innerText = "Odpověď nenalezena.";
        }

      } catch (err) {
        logError("Chyba sítě: " + err.message);
        document.getElementById('answer').innerText = "Chyba připojení k serveru.";
      }
    }
  </script>
</body>
</html>
